<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watchmarker · Quick history</title>
    <link rel="icon" type="image/png" href="content/icon.png" />
    <link rel="stylesheet" href="content/fontawesome.css" />
    <link rel="stylesheet" href="content/ui.css" />
    <link rel="stylesheet" href="content/history.css" />
    <link rel="stylesheet" href="content/popup.css" />
    <link rel="stylesheet" href="content/statistics-popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body class="popup">
    <div class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"
            ><i class="fas fa-play"></i><span></span></span
          ><span>watchmarker</span>
        </div>
        <div class="popup-actions">
          <button
            class="icon-button"
            id="theme-toggle"
            type="button"
            aria-label="Theme: System. Switch to light theme"
            title="Theme: System. Switch to light theme"
          >
            <i class="fas fa-desktop" id="theme-icon" aria-hidden="true"></i>
          </button>
          <a
            class="icon-button"
            href="content/index.html#preferences"
            id="open-preferences"
            aria-label="Open preferences in a new tab"
            title="Preferences"
            ><i class="fas fa-sliders" aria-hidden="true"></i
          ></a>
        </div>
      </header>
      <main class="popup-main">
        <div class="popup-heading">
          <h1 id="popup-heading">Watch history</h1>
        </div>
        <a
          class="stats-peek"
          id="open-statistics"
          href="content/index.html#statistics"
          title="Watch time · Open statistics"
        >
          <div id="popup-statistics" aria-busy="true">
            <span class="visually-hidden">Loading watch statistics…</span>
            <div class="stats-peek-loading" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
          </div>
          <span class="visually-hidden">Open watch statistics</span>
        </a>
        <div class="search-box" role="search">
          <i
            class="fas fa-magnifying-glass search-decoration"
            aria-hidden="true"
          ></i
          ><input
            type="search"
            id="idSearch_Query"
            placeholder="Search title or video ID"
            aria-label="Search watch history by title or video ID"
            autocomplete="off"
            autofocus
          /><button
            class="icon-button clear-search"
            id="clear-search"
            type="button"
            aria-label="Clear search"
            hidden
          >
            <i class="fas fa-xmark" aria-hidden="true"></i></button
          ><button
            class="search-submit"
            id="idSearch_Lookup"
            type="button"
            aria-label="Search history"
          >
            <i
              class="fas fa-arrow-right"
              id="search-icon"
              aria-hidden="true"
            ></i
            ><i
              class="fas fa-spinner fa-spin"
              hidden
              id="search-spinner"
              aria-hidden="true"
            ></i>
          </button>
        </div>
        <div
          id="popup-feedback"
          class="popup-feedback"
          role="alert"
          hidden
        ></div>
        <div
          id="idSearch_Results"
          class="history-results"
          role="region"
          aria-label="Watch history results"
          aria-busy="true"
          tabindex="0"
        >
          <div class="history-empty">
            <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
            <p>Loading…</p>
          </div>
        </div>
        <div
          id="search-status"
          class="visually-hidden"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
      </main>
      <footer class="popup-footer">
        <a href="content/index.html" id="open-options"
          >Watch history
          <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i
          ><span class="visually-hidden"> (opens in a new tab)</span></a
        >
        <span id="result-count"></span>
      </footer>
    </div>
  </body>
</html>
