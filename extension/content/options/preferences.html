<section
  id="panel-preferences"
  class="app-panel"
  aria-labelledby="preferences-heading"
  hidden
>
  <div class="page-heading">
    <div>
      <h1 id="preferences-heading">Preferences</h1>
    </div>
  </div>
  <div class="section-stack">
    <section
      class="surface-card settings-card"
      aria-labelledby="detection-heading"
    >
      <div class="section-heading">
        <div>
          <h2 id="detection-heading">Watch detection</h2>
        </div>
      </div>
      <div class="preference-row">
        <label for="idCondition_Brownav" title="After 1 minute of playback"
          ><strong>Browser navigation</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idCondition_Brownav"
          />
        </div>
      </div>
      <div class="preference-row">
        <label
          for="idCondition_Browhist"
          title="Backfill history from before measured tracking began"
          ><strong>Browser history</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idCondition_Browhist"
          />
        </div>
      </div>
      <div class="preference-row">
        <label for="idCondition_Youprog" title="After 1 minute of playback"
          ><strong>YouTube progress</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idCondition_Youprog"
          />
        </div>
      </div>
      <div class="preference-row">
        <label
          for="idCondition_Youhist"
          title="Hourly import of older history and of newer videos YouTube shows at least a minute in"
          ><strong>YouTube history</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idCondition_Youhist"
          />
        </div>
      </div>
      <div class="preference-row">
        <label
          for="idCondition_Yourating"
          title="After rating and 1 minute of playback"
          ><strong>Video rating</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idCondition_Yourating"
          />
        </div>
      </div>
    </section>
    <section
      class="surface-card settings-card"
      aria-labelledby="appearance-heading"
    >
      <div class="section-heading">
        <div>
          <h2 id="appearance-heading">Appearance</h2>
        </div>
      </div>
      <div class="preference-row">
        <label for="idVisualization_Fadeout"
          ><strong>Fade thumbnails</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idVisualization_Fadeout"
          />
        </div>
      </div>
      <div class="preference-row">
        <label for="idVisualization_Grayout"
          ><strong>Grayscale thumbnails</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idVisualization_Grayout"
          />
        </div>
      </div>
      <div class="preference-row">
        <label for="idVisualization_Showbadge"
          ><strong>Watched badge</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idVisualization_Showbadge"
          />
        </div>
      </div>
      <div class="preference-row">
        <label for="idVisualization_Showdate"
          ><strong>Last watch date</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idVisualization_Showdate"
          />
        </div>
      </div>
      <div class="preference-row">
        <label for="idVisualization_Showcount"
          ><strong>Watch count</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idVisualization_Showcount"
          />
        </div>
      </div>
      <div class="preference-row">
        <label for="idVisualization_Hideprogress"
          ><strong>Hide progress bars</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idVisualization_Hideprogress"
          />
        </div>
      </div>
      <div class="preference-row">
        <label for="idVisualization_Hidepaidpromotion"
          ><strong>Hide paid-promotion overlays</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idVisualization_Hidepaidpromotion"
          />
        </div>
      </div>
      <div class="preference-row">
        <label for="idBlocking_Enabled"
          ><strong>Allow hiding unwanted videos</strong></label
        >
        <div class="preference-switch">
          <input
            class="switch-input"
            type="checkbox"
            role="switch"
            id="idBlocking_Enabled"
          />
        </div>
      </div>
      <div id="blocked-videos-panel" hidden>
        <h3>Blocked videos</h3>
        <p data-blocked-status role="status" aria-live="polite"></p>
        <button
          class="btn btn-secondary"
          type="button"
          data-blocked-retry
          hidden
        >
          Retry
        </button>
        <ul
          class="blocked-videos-list"
          data-blocked-list
          aria-label="Blocked videos"
        ></ul>
      </div>
    </section>
  </div>
</section>
