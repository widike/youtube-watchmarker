<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search and sync your YouTube watch history with Watchmarker."
    />
    <title>Watchmarker · Watch history</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="stylesheet" href="fontawesome.css" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="options.css" />
    <script type="module" src="index.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <aside class="app-sidebar" aria-label="Watchmarker">
      <a
        href="https://github.com/widike/youtube-watchmarker"
        class="brand"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Watchmarker GitHub repository (opens in a new tab)"
        ><span class="brand-mark" aria-hidden="true"
          ><i class="fas fa-play"></i><span></span></span
        ><span>watchmarker</span></a
      >
      <nav class="app-navigation" aria-label="Main navigation">
        <a href="#history" data-section="history" aria-current="page"
          ><i class="fas fa-clock-rotate-left" aria-hidden="true"></i>Watch
          history<span class="nav-dot" aria-hidden="true"></span
        ></a>
        <a href="#statistics" data-section="statistics"
          ><i class="fas fa-chart-simple" aria-hidden="true"></i>Statistics</a
        >
        <a href="#sync" data-section="sync"
          ><i class="fas fa-arrows-rotate" aria-hidden="true"></i>Sync &amp;
          data</a
        >
        <a href="#preferences" data-section="preferences"
          ><i class="fas fa-sliders" aria-hidden="true"></i>Preferences</a
        >
      </nav>
      <div class="sidebar-library">
        <span class="library-symbol" aria-hidden="true"
          ><i class="fas fa-layer-group"></i></span
        ><strong id="idDatabase_Size">…</strong><span>videos</span>
      </div>
      <div class="sidebar-footer">
        <button
          class="icon-button"
          id="theme-toggle"
          type="button"
          aria-label="Theme: System. Switch to light theme"
          title="Theme: System. Switch to light theme"
        >
          <i class="fas fa-desktop" id="theme-icon" aria-hidden="true"></i>
        </button>
      </div>
    </aside>
    <main id="main-content" class="app-main" tabindex="-1">
      <section
        id="panel-history"
        class="app-panel"
        aria-labelledby="history-heading"
      >
        <div class="page-heading">
          <div>
            <h1 id="history-heading">Watch history</h1>
          </div>
          <a href="#sync" class="quiet-button"
            ><i class="fas fa-arrows-rotate" aria-hidden="true"></i>Sync
            history</a
          >
        </div>
        <div class="search-box" role="search">
          <i
            class="fas fa-magnifying-glass search-decoration"
            aria-hidden="true"
          ></i
          ><input
            type="search"
            id="idSearch_Query"
            placeholder="Search title or video ID"
            aria-label="Search watch history by title or video ID"
            autocomplete="off"
          /><button
            class="icon-button clear-search"
            id="clear-search"
            aria-label="Clear search"
            hidden
          >
            <i class="fas fa-xmark" aria-hidden="true"></i></button
          ><button
            class="search-submit"
            id="idSearch_Lookup"
            aria-label="Search history"
          >
            <i
              class="fas fa-arrow-right"
              id="search-icon"
              aria-hidden="true"
            ></i
            ><i
              class="fas fa-spinner fa-spin"
              hidden
              id="search-spinner"
              aria-hidden="true"
            ></i>
          </button>
        </div>
        <div class="page-toolbar library-toolbar" id="library-toolbar">
          <div class="filter-controls">
            <label class="select-control"
              ><i class="far fa-calendar" aria-hidden="true"></i
              ><span class="visually-hidden">Date range</span
              ><select id="history-period">
                <option value="all">All time</option>
                <option value="today">Today</option>
                <option value="week">Last 7 days</option>
                <option value="month">Last 30 days</option>
              </select></label
            ><label class="select-control"
              ><i class="fas fa-arrow-down-wide-short" aria-hidden="true"></i
              ><span class="visually-hidden">Sort videos</span
              ><select id="history-sort">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="most">Most watched</option>
                <option value="title">Title A–Z</option>
              </select></label
            >
          </div>
          <div class="display-controls">
            <div
              class="segmented-control"
              role="group"
              aria-label="History layout"
            >
              <button
                data-history-view="list"
                class="icon-button"
                aria-label="List view"
                title="List view"
                aria-pressed="false"
              >
                <i class="fas fa-list" aria-hidden="true"></i></button
              ><button
                data-history-view="grid"
                class="icon-button"
                aria-label="Grid view"
                title="Grid view"
                aria-pressed="true"
              >
                <i class="fas fa-table-cells-large" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="library-summary">
          <h2 id="history-result-count">…</h2>
        </div>
        <div
          id="history-search-status"
          class="visually-hidden"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
        <div id="idSearch_Results" class="history-results" aria-busy="true">
          <div class="history-empty">
            <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
            <p>Loading…</p>
          </div>
        </div>
      </section>
      <div data-settings-panel="statistics"></div>
      <div data-settings-panel="sync"></div>
      <div data-settings-panel="preferences"></div>
      <div
        id="operation-status"
        class="operation-status"
        role="status"
        aria-live="polite"
      ></div>
    </main>
    <div class="error-notifications">
      <div
        id="errorToast"
        class="error-notification"
        hidden
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="error-notification-heading">
          <i class="fas fa-circle-exclamation" aria-hidden="true"></i
          ><strong>Error</strong
          ><button
            type="button"
            class="icon-button"
            data-dismiss-error
            aria-label="Dismiss error"
          >
            <i class="fas fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div class="error-notification-message" id="errorToastMessage"></div>
      </div>
    </div>
    <div
      id="sr-announcements"
      class="visually-hidden"
      aria-live="polite"
      aria-atomic="true"
    ></div>
  </body>
</html>
